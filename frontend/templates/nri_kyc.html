<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRI KYC Documentation</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --border-radius: 12px;
            --box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3748;
        }
        
        .form-container {
            width: 100%;
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
        }
        
        h1 {
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .file-upload {
            margin: 15px 0;
        }
        
        .btn {
            padding: 12px 30px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: block;
            width: 100%;
            margin-top: 20px;
        }
        
        .btn:hover {
            background-color: #3a56d4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Additional NRI Documentation</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="passport_number">Passport Number</label>
                <input type="text" id="passport_number" name="passport_number" required>
            </div>
            
            <div class="form-group">
                <label for="country_of_residence">Country of Residence</label>
                <input type="text" id="country_of_residence" name="country_of_residence" required>
            </div>
            
            <div class="form-group">
                <label for="visa_type">Visa Type</label>
                <select id="visa_type" name="visa_type" required>
                    <option value="">Select Visa Type</option>
                    <option value="work">Work Visa</option>
                    <option value="student">Student Visa</option>
                    <option value="resident">Resident Visa</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="file-upload">
                <label>Passport Copy (PDF/Image)</label>
                <input type="file" name="passport" accept=".pdf,.jpg,.jpeg,.png" required>
            </div>
            
            <div class="file-upload">
                <label>Visa Document (PDF/Image)</label>
                <input type="file" name="visa" accept=".pdf,.jpg,.jpeg,.png" required>
            </div>
            
            <div class="file-upload">
                <label>Overseas Address Proof</label>
                <input type="file" name="overseas_address_proof" accept=".pdf,.jpg,.jpeg,.png" required>
            </div>
            
            <button type="submit" class="btn">Submit Documents</button>
        </form>
    </div>
</body>
</html>
