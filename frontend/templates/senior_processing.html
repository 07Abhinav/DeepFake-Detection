<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Citizen Processing</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --warning-color: #FF9800;
            --border-radius: 12px;
            --box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3748;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: var(--warning-color);
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        .icon {
            font-size: 60px;
            margin: 20px 0;
            color: var(--warning-color);
        }
        
        .info-box {
            background-color: #FFF8E1;
            padding: 20px;
            border-radius: var(--border-radius);
            margin: 20px 0;
            text-align: left;
        }
        
        .btn {
            padding: 12px 30px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
            display: inline-block;
        }
        
        .btn:hover {
            background-color: #3a56d4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Manual Verification Requested</h1>
        <div class="icon">✓</div>
        
        <div class="info-box">
            <p>Your manual verification request has been received. Our team will contact you within 24 hours.</p>
            <p>Please keep your original documents ready for verification.</p>
            <p><strong>Contact Number:</strong> 1800-123-4567 (Senior Citizen Helpline)</p>
        </div>
        
        <a href="/" class="btn">Return to Home</a>
    </div>
</body>
</html>
