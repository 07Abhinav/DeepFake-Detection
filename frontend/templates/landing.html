<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank - Your Digital Banking Partner</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #f4f7f9;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-title {
            font-size: 24px;
            margin-bottom: 30px;
            color: #ecf0f1;
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .sidebar-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.3s ease;
        }
        .sidebar-btn:hover {
            background-color: #2980b9;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .content-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
        }
        .features {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .feature {
            flex: 1;
            padding: 15px;
            background-color: #f1f6f9;
            margin: 0 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-title">SecureScan</div>
        <div class="sidebar-nav">
            <a href="/index" class="sidebar-btn">E-KYC Application</a>
            <a href="#" class="sidebar-btn">Contact Support</a>
        </div>
    </div>
    
    <div class="main-content">
        <div class="content-container">
            <h1>SecureScan for Deepfake Videos</h1>
            <p>Your trusted digital banking partner, providing secure and convenient financial services.</p>
            
            <div class="features">
                <div class="feature">
                    <h3>Digital Security</h3>
                    <p>Advanced encryption and multi-factor authentication</p>
                </div>
                <div class="feature">
                    <h3>Quick Services</h3>
                    <p>Fast E-KYC verification</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
